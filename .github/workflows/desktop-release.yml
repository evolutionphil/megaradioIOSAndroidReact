name: Desktop Release (Win + Linux)

# Build both operating systems before publishing a single release.
# macOS uses its separately signed App Store/notarization distribution.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend/tvanddesktop/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer dependencies
        working-directory: frontend/tvanddesktop/apple-tv-and-macos/web-preview
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Install desktop dependencies
        run: npm ci

      - name: Check release integration
        working-directory: .
        run: node --test tests/apple-release-iap.test.cjs

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish never

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          path: |
            frontend/tvanddesktop/desktop/dist/*.exe
            frontend/tvanddesktop/desktop/dist/*.blockmap
            frontend/tvanddesktop/desktop/dist/*.AppImage
            frontend/tvanddesktop/desktop/dist/*.deb
            frontend/tvanddesktop/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          merge-multiple: true
          path: release-assets
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./frontend/tvanddesktop/desktop/package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "MegaRadio ${version}" --notes "Windows and Linux desktop update with the shared TV interface and current CDN delivery."
          fi
          gh release upload "$tag" release-assets/* --clobber
