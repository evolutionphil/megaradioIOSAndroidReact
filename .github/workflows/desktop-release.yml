name: Desktop Release (Win + Linux)

# git tag v1.0.x atınca otomatik tetiklenir.
# Windows ve Linux build'leri paralel çalışır; çıktılar GitHub Releases'e atılır.
# macOS build'i lokal Mac'te yapıldığı için CI'a dahil değildir
# (DMG + Mac App Store .pkg user'ın makinesinde imzalanıp Transporter ile yüklenir).

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # manuel tetikleme de mümkün (Actions sekmesi)

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend/tvanddesktop/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --network-timeout 600000

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run electron-builder --win nsis portable --publish always

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run electron-builder --linux AppImage deb --publish always

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          path: |
            frontend/tvanddesktop/desktop/dist/*.exe
            frontend/tvanddesktop/desktop/dist/*.AppImage
            frontend/tvanddesktop/desktop/dist/*.deb
            frontend/tvanddesktop/desktop/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 30
