name: Check Cloudflare CDN access
on:
  workflow_dispatch:
    inputs:
      disable_bot_fight_mode:
        description: 'Disable approved Bot Fight Mode and its JavaScript detections for themegaradio.com'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check existing deployment credentials and bot configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISABLE_BOT_FIGHT_MODE: ${{ inputs.disable_bot_fight_mode }}
        run: |
          node <<'NODE'
          async function api(label, path) {
            const response = await fetch('https://api.cloudflare.com/client/v4/' + path, {
              headers: { Authorization: 'Bearer ' + process.env.CF_TOKEN },
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.json();
            console.log(JSON.stringify({ check: label, status: response.status, success: body.success, errorCodes: (body.errors || []).map(e => e.code) }));
            return body.success ? body.result : null;
          }
          (async () => {
            if (!process.env.CF_TOKEN || !process.env.CF_ACCOUNT) throw new Error('Missing deployment secrets');
            const deployments = await api('original Worker access', `accounts/${process.env.CF_ACCOUNT}/workers/scripts/megaradio-tv/deployments`);
            if (!deployments) process.exitCode = 1;
            const zones = await api('zone lookup', 'zones?name=themegaradio.com');
            console.log(JSON.stringify({ zones: zones?.map(z => ({ id: z.id, name: z.name, status: z.status, paused: z.paused, name_servers: z.name_servers })) }));
            const domains = await api('Worker custom domains', `accounts/${process.env.CF_ACCOUNT}/workers/domains`);
            console.log(JSON.stringify({ cdnDomain: domains?.filter(d => d.hostname === 'cdn.themegaradio.com') }));
            if (zones?.length === 1) {
              const bots = await api('bot configuration', `zones/${zones[0].id}/bot_management`);
              if (bots) console.log(JSON.stringify({ botSettings: bots }));
              for (const setting of ['security_level', 'browser_check']) {
                const value = await api(setting, `zones/${zones[0].id}/settings/${setting}`);
                if (value) console.log(JSON.stringify({ setting, value: value.value }));
              }
              for (const phase of ['http_request_firewall_custom', 'http_request_sbfm', 'http_config_settings']) {
                const ruleset = await api(phase, `zones/${zones[0].id}/rulesets/phases/${phase}/entrypoint`);
                if (ruleset) console.log(JSON.stringify({ phase, rules: ruleset.rules?.map(r => ({ id: r.id, action: r.action, expression: r.expression, enabled: r.enabled, action_parameters: r.action_parameters })) }));
              }
              const query = 'query Events($zoneTag: string, $filter: FirewallEventsAdaptiveFilter_InputObject) { viewer { zones(filter: {zoneTag: $zoneTag}) { firewallEventsAdaptive(filter: $filter, limit: 12, orderBy: [datetime_DESC]) { action datetime source ruleId rayName clientRequestHTTPHost clientRequestPath } } } }';
              const analytics = await fetch('https://api.cloudflare.com/client/v4/graphql', {
                method: 'POST', headers: { Authorization: 'Bearer ' + process.env.CF_TOKEN, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables: { zoneTag: zones[0].id, filter: { datetime_geq: new Date(Date.now() - 3600000).toISOString(), datetime_leq: new Date().toISOString(), clientRequestHTTPHost: 'cdn.themegaradio.com' } } }),
                signal: AbortSignal.timeout(20000),
              });
              const events = await analytics.json();
              console.log(JSON.stringify({ securityEvents: events.data?.viewer?.zones, analyticsErrors: events.errors?.map(e => e.message) }));
              if (process.env.DISABLE_BOT_FIGHT_MODE === 'true') {
                const response = await fetch(`https://api.cloudflare.com/client/v4/zones/${zones[0].id}/bot_management`, {
                  method: 'PUT', headers: { Authorization: 'Bearer ' + process.env.CF_TOKEN, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ fight_mode: false, enable_js: false }), signal: AbortSignal.timeout(20000),
                });
                const body = await response.json();
                console.log(JSON.stringify({ check: 'approved Bot Fight Mode disable', status: response.status, success: body.success, errorCodes: (body.errors || []).map(e => e.code) }));
                if (!body.success || body.result?.fight_mode !== false || body.result?.enable_js !== false) throw new Error('Bot Fight Mode disable failed');
              }
            }
            const live = await fetch('https://cdn.themegaradio.com/version.json?diagnostic=' + Date.now(), {
              headers: { 'User-Agent': 'Mozilla/5.0 (compatible; MegaRadioCDNVerifier/1.0)' }, signal: AbortSignal.timeout(20000),
            });
            console.log(JSON.stringify({ check: 'public CDN', status: live.status, mitigation: live.headers.get('cf-mitigated'), ray: live.headers.get('cf-ray') }));
            for (const [client, agent] of [
              ['Samsung', 'Mozilla/5.0 (SMART-TV; LINUX; Tizen 5.5) AppleWebKit/537.36 (KHTML, like Gecko) 69.0.3497.106/5.5 TV Safari/537.36'],
              ['LG', 'Mozilla/5.0 (Web0S; Linux/SmartTV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/53.0.2785.34 Safari/537.36 WebAppManager'],
            ]) {
              const response = await fetch('https://cdn.themegaradio.com/version.json?client=' + client + '&probe=' + Date.now(), {
                headers: { 'User-Agent': agent, Origin: 'null', Accept: 'application/json' }, signal: AbortSignal.timeout(20000),
              });
              console.log(JSON.stringify({ client, status: response.status, mitigation: response.headers.get('cf-mitigated'), ray: response.headers.get('cf-ray') }));
            }

          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
