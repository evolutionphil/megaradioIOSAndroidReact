# MegaRadio TV — Apple TV (tvOS) + macOS Project Specification
#
# This file is the SINGLE SOURCE OF TRUTH for the MegaRadioTV.xcodeproj.
# DO NOT EDIT the generated `.xcodeproj` manually — your changes will be
# overwritten on the next `yarn tvos:setup` run.
#
# Regenerate the project with:
#     yarn tvos:setup
#
# Open Xcode with:
#     open MegaRadioTV.xcodeproj
#
# This project is completely INDEPENDENT from the iOS/WatchOS app
# (`frontend/ios/MegaRadio.xcodeproj`). It uses NO React Native — instead
# it ships a tiny SwiftUI shell that loads the TV web preview via
# WKWebView, plus native bridges for Siri remote, ShazamKit and StoreKit.

name: MegaRadioTV

options:
  # Use Xcode 15+ format (no legacy build system)
  bundleIdPrefix: com.visiongo.megaradio
  deploymentTarget:
    tvOS: "17.0"
    macOS: "14.0"
  developmentLanguage: "en"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

# Project-level build settings shared by all targets.
settings:
  base:
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)" # Read from .env / Xcode personal settings
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO       # Match iOS project policy
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO             # We provide our own Info.plist
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
    # ──────────────────────────────────────────────────────────────────
    # Bundle Identifier strategy
    #
    # Currently: `com.visiongo.megaradio.tv`
    #   — a SEPARATE App ID from the iOS app. Xcode auto-registers it
    #   on first build, no manual Apple Developer Portal work needed.
    #   App will appear on the tvOS App Store as a STANDALONE listing.
    #
    # Future (Universal Purchase): change to `com.visiongo.megaradio`
    #   — identical bundle ID to iOS. Users buy ONCE, use on iPhone
    #   + Apple TV. Requires one-time manual step:
    #     1) Visit https://developer.apple.com/account/resources/identifiers/list
    #     2) Click on `com.visiongo.megaradio`
    #     3) Scroll down → "Additional Capabilities"
    #     4) Enable "tvOS" alongside iOS
    #     5) Save. The provisioning profile will then auto-generate.
    #
    # When you switch back, just edit this single line and re-run
    # `yarn tvos:setup`.
    PRODUCT_BUNDLE_IDENTIFIER: com.visiongo.megaradio.tv

# ────────────────────────────────────────────────────────────────────────
# TARGETS
# ────────────────────────────────────────────────────────────────────────
targets:

  # ──────────────────────────────────────────────────────────────────────
  # NOTE: This project ONLY ships an Apple TV (tvOS) target.
  #
  # The macOS version of MegaRadio is shipped via the existing Electron
  # app at `frontend/tvanddesktop/desktop/`, which is:
  #   • Already production-ready (DMG signed with Vision Go GmbH)
  #   • Cross-platform (Windows + Linux + macOS from the same codebase)
  #   • Identical UX to iOS/Android (loads the same TV web preview)
  #   • Bundle id `com.visiongo.megaradio` (universal-purchase compatible
  #     with this tvOS target)
  #
  # We considered adding a separate native SwiftUI macOS target here but
  # decided against it — Electron already covers macOS with ~zero extra
  # maintenance, while a native SwiftUI app would duplicate the UI in
  # AppKit and demand its own Mac-only signing pipeline.
  #
  # If, in the future, we want a Mac App Store listing (vs. direct DMG),
  # we can add `mas` to `electron-builder` (5-minute change in
  # `frontend/tvanddesktop/desktop/package.json`).
  # ──────────────────────────────────────────────────────────────────────

  # 🟦 Main tvOS App
  MegaRadioTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: MegaRadioTVApp.swift          # tvOS-only (UIKit + UIPress + AVAudioSession)
      - path: StoreKitIapService.swift      # tvOS StoreKit 2 native IAP
      # ShazamRecognizer.swift is intentionally EXCLUDED — ShazamKit is
      # not available on tvOS at all. (It still exists on disk so the
      # macOS Electron app can shell out to a helper extension later
      # if we ever need song-recognition on the desktop.)
      - path: Brand
        type: folder         # Treat as resource bundle
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "MegaRadio TV"
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: MegaRadioTV
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: false
        UILaunchStoryboardName: ""
        UIRequiredDeviceCapabilities: [arm64]
        # Siri intent surface
        NSUserActivityTypes: [INPlayMediaIntent]
        INAlternativeAppNames:
          - MegaRadio
          - Mega Radio
        # Background audio + AirPlay
        UIBackgroundModes: [audio, fetch, processing]
        # ShazamKit privacy
        NSAppleMusicUsageDescription: "MegaRadio uses Apple Music's audio recognition to identify songs playing on the radio."
        NSMicrophoneUsageDescription: "MegaRadio listens briefly to identify songs playing on the radio."
        # ATS – allow legacy radio streams (most stations are still HTTP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: MegaRadioTV.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # NOTE: Application Groups, Siri, ShazamKit, and CarPlay-related
        # entitlements are intentionally OMITTED for development.
        #
        # Adding ANY entitlement here requires that the App ID has the
        # corresponding Capability enabled in Apple Developer Portal
        # FIRST. With auto-registered bundle IDs that's not the case,
        # so leaving the list minimal means Xcode can auto-create the
        # provisioning profile on first build with zero portal trips.
        #
        # When you're ready to ship, enable the needed capabilities
        # in Xcode → Signing & Capabilities → "+ Capability" and they
        # will be added to this file automatically.
    settings:
      base:
        SDKROOT: appletvos
        TARGETED_DEVICE_FAMILY: "3"           # 3 = Apple TV
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TVOS_DEPLOYMENT_TARGET: "17.0"
