# MegaRadio TV — Apple TV (tvOS) + macOS Project Specification
#
# This file is the SINGLE SOURCE OF TRUTH for the MegaRadioTV.xcodeproj.
# DO NOT EDIT the generated `.xcodeproj` manually — your changes will be
# overwritten on the next `yarn tvos:setup` run.
#
# Regenerate the project with:
#     yarn tvos:setup
#
# Open Xcode with:
#     open MegaRadioTV.xcodeproj
#
# This project is completely INDEPENDENT from the iOS/WatchOS app
# (`frontend/ios/MegaRadio.xcodeproj`). It uses NO React Native — instead
# it ships a tiny SwiftUI shell that loads the TV web preview via
# WKWebView, plus native bridges for Siri remote, ShazamKit and StoreKit.

name: MegaRadioTV

options:
  # Use Xcode 15+ format (no legacy build system)
  bundleIdPrefix: com.visiongo.megaradio
  deploymentTarget:
    tvOS: "17.0"
    macOS: "14.0"
  developmentLanguage: "en"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

# Project-level build settings shared by all targets.
settings:
  base:
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)" # Read from .env / Xcode personal settings
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO       # Match iOS project policy
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO             # We provide our own Info.plist
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
    # ──────────────────────────────────────────────────────────────────
    # Bundle Identifier — UNIVERSAL PURCHASE
    #
    # `com.visiongo.megaradio` is the SAME App ID as the iOS app.
    # The App ID is configured at https://developer.apple.com/account/
    # resources/identifiers/list to support iOS + iPadOS + macOS + tvOS
    # + watchOS + visionOS at the platform level — so a tvOS app with
    # this bundle id is valid and provisioning will succeed.
    #
    # On the App Store, this means iOS users can install the Apple TV
    # version with a single tap on their TV. Universal Purchase is
    # active automatically.
    # ──────────────────────────────────────────────────────────────────
    PRODUCT_BUNDLE_IDENTIFIER: com.visiongo.megaradio

# ────────────────────────────────────────────────────────────────────────
# TARGETS
# ────────────────────────────────────────────────────────────────────────
targets:

  # ──────────────────────────────────────────────────────────────────────
  # NOTE: This project ONLY ships an Apple TV (tvOS) target.
  #
  # The macOS version of MegaRadio is shipped via the existing Electron
  # app at `frontend/tvanddesktop/desktop/`, which is:
  #   • Already production-ready (DMG signed with Vision Go GmbH)
  #   • Cross-platform (Windows + Linux + macOS from the same codebase)
  #   • Identical UX to iOS/Android (loads the same TV web preview)
  #   • Bundle id `com.visiongo.megaradio` (universal-purchase compatible
  #     with this tvOS target)
  #
  # We considered adding a separate native SwiftUI macOS target here but
  # decided against it — Electron already covers macOS with ~zero extra
  # maintenance, while a native SwiftUI app would duplicate the UI in
  # AppKit and demand its own Mac-only signing pipeline.
  #
  # If, in the future, we want a Mac App Store listing (vs. direct DMG),
  # we can add `mas` to `electron-builder` (5-minute change in
  # `frontend/tvanddesktop/desktop/package.json`).
  # ──────────────────────────────────────────────────────────────────────

  # 🟦 Main tvOS App
  MegaRadioTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    # Frameworks used by the native tvOS app:
    #   • AVFoundation / AVKit — AVPlayer for live radio streams
    #   • MediaPlayer       — Lock-screen / Siri Remote "Now Playing" info
    # WebKit is intentionally NOT here because WKWebView is unavailable
    # on tvOS (Apple platform restriction). The Apple TV app is fully
    # native SwiftUI calling the same API as iOS/Android.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
    sources:
      - path: MegaRadioTVApp.swift          # @main entry + AVAudioSession setup
      - path: TVRouter.swift                # Hash-router clone for navigation
      - path: CountryStore.swift            # Country selection persistence
      - path: CountryCatalog.swift          # /countries fetch + ISO map + flag URLs
      - path: Models.swift                  # Station / Genre / Country structs
      - path: APIClient.swift               # HTTP wrapper for api.themegaradio.com
      - path: AudioPlayer.swift             # AVPlayer wrapper (ObservableObject)
      - path: AuthStore.swift               # Pairing-code login + JWT storage
      - path: FavoritesStore.swift          # Local favorites persistence
      - path: Theme.swift                   # Brand tokens + Ubuntu font + Stage1920x1080 + BrandImage
      - path: Views.swift                   # Router + shared widgets (logo, sidebar, header, global player)
      - path: Splash.swift                  # /          → SplashPage
      - path: Guides.swift                  # /guide-1..4 → GuidePage(step:)
      - path: Discover.swift                # /discover-no-user → DiscoverPage + StationCardLarge
      - path: RadioPlaying.swift            # /radio-playing → RadioPlayingPage
      - path: Genres.swift                  # /genres + /genre-list/:tag
      - path: Search.swift                  # /search
      - path: Favorites.swift               # /favorites
      - path: Settings.swift                # /settings + /login
      - path: CountrySelect.swift           # /country-select
      - path: StoreKitIapService.swift      # tvOS StoreKit 2 IAP
      # ShazamRecognizer.swift is intentionally EXCLUDED — ShazamKit is
      # not available on tvOS at all. (Still on disk for future macOS use.)
      # `type: group` flattens files into the app bundle root, so
      # `Bundle.main.url(forResource:withExtension:)` finds them by name.
      # `type: folder` (the previous setting) created a folder reference
      # that preserved subdirectories and prevented runtime lookup.
      - path: Brand
        type: group
        buildPhase: resources
      - path: Assets/Images
        type: group          # Web-preview assets (logo, icons, hero backgrounds)
        buildPhase: resources
      - path: Assets/Fonts
        type: group          # Ubuntu font family (Light/Regular/Medium/Bold)
        buildPhase: resources
    info:
      # IMPORTANT: We provide a STATIC Info.plist on disk rather than letting
      # xcodegen generate it from `properties:` below. This guarantees the
      # critical `NSAppTransportSecurity.NSAllowsArbitraryLoads` key survives
      # every regeneration. Without it the app cannot stream HTTP radio or
      # show station logos hosted on legacy HTTP servers.
      path: Info.plist
    entitlements:
      path: MegaRadioTV.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # NOTE: Application Groups, Siri, ShazamKit, and CarPlay-related
        # entitlements are intentionally OMITTED for development.
        #
        # Adding ANY entitlement here requires that the App ID has the
        # corresponding Capability enabled in Apple Developer Portal
        # FIRST. With auto-registered bundle IDs that's not the case,
        # so leaving the list minimal means Xcode can auto-create the
        # provisioning profile on first build with zero portal trips.
        #
        # When you're ready to ship, enable the needed capabilities
        # in Xcode → Signing & Capabilities → "+ Capability" and they
        # will be added to this file automatically.
    settings:
      base:
        SDKROOT: appletvos
        TARGETED_DEVICE_FAMILY: "3"           # 3 = Apple TV
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TVOS_DEPLOYMENT_TARGET: "17.0"
        # ──────────────────────────────────────────────────────────────
        # Simulator-only code signing override
        #
        # tvOS Simulator builds don't actually need a real provisioning
        # profile, but Xcode's "Automatic" signing flow still calls
        # Apple Developer Portal to fetch one — and fails with
        # "team has no devices" if no tvOS device is registered.
        # These SDK-scoped overrides tell Xcode to skip signing entirely
        # for the `appletvsimulator` SDK while keeping real signing
        # active for `appletvos` (physical Apple TV) builds.
        #
        # If you later want to install on a real Apple TV, register
        # the device in Apple Developer Portal (Devices tab) and
        # Xcode will pick it up from the `appletvos` settings.
        # ──────────────────────────────────────────────────────────────
        "CODE_SIGN_IDENTITY[sdk=appletvsimulator*]": ""
        "CODE_SIGNING_REQUIRED[sdk=appletvsimulator*]": "NO"
        "CODE_SIGNING_ALLOWED[sdk=appletvsimulator*]": "NO"
