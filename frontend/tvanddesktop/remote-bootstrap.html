<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MegaRadio</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0e0e0e; overflow: hidden; }
  #root { width: 100%; height: 100%; background: #0e0e0e; }
  #boot { position: absolute; top: 50%; left: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); text-align: center; font-family: Arial, sans-serif; }
  #boot .ring { width: 64px; height: 64px; margin: 0 auto 26px; border: 6px solid rgba(255,255,255,0.14); border-top-color: #ff4199; border-radius: 50%; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
  #boot p { color: #7a7a7a; font-size: 22px; letter-spacing: 2px; margin: 0; }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="root"><div id="boot"><div class="ring"></div><p>MEGARADIO</p></div></div>
<script>
/*
 * MegaRadio TV — Remote-update bootstrap (ES5, Tizen/WebOS safe) — INJECT model.
 *
 * WHY INJECT (not navigate): On Tizen/WebOS the native APIs (`tizen`, `webapis`,
 * `webOS`) are injected by the runtime ONLY into the app's OWN document. If we
 * navigate the top-level document to a remote https origin (the CDN), those
 * globals are gone → `webapis.avplay` audio + `tizen.tvinputdevice` keys break.
 *
 * So instead we KEEP this local file:// document as the app context and pull the
 * app's JS/CSS/assets FROM the CDN into it:
 *   • Compatible cached CDN index.html -> recreate its resources here.
 *     Its classic/SystemJS bundle runs
 *     in THIS local document, so `tizen`/`webapis`/`webOS` stay available, while
 *     the code is the last successfully cached CDN version (next-launch update).
 *   • CDN down / timeout / killSwitch      ->  navigate to the LOCAL copy bundled
 *     in the store package (./app/index.html) — offline-safe, review-safe.
 *
 * __CDN_BASE__ is replaced at package time by prepare-tizen.js / prepare-webos.js.
 * The CDN bundle is built with an ABSOLUTE base (= __CDN_BASE__) by build-cdn.js,
 * so its assets already point at the CDN. window.__MR_ASSET_BASE__ makes the app's
 * assetPath() pull images/fonts from the CDN too.
 */
(function () {
  try { console.log('[MegaRadio] INJECT bootstrap v3 — classic legacy loader, local native context'); } catch (e) {}
  var CDN_BASE = '__CDN_BASE__';            // e.g. https://cdn.themegaradio.com/
  var LOCAL    = './app/index.html';        // bundled fallback copy
  var TIMEOUT  = 20000;
  var done     = false;
  var fallingBack = false;
  var bootTimer = null;
  var APP_VERSION    = '__APP_VERSION__';   // store package version (replaced at package time)
  var REMOTE_VERSION = '';                  // CDN bundle version (read from version.json)

  // Fire-and-forget open-telemetry beacon — NEVER blocks or breaks the app.
  // Lets the dashboard see how many TVs run each bundle version and whether they
  // booted from the CDN ("remote") or the bundled fallback ("local") — the
  // killSwitch rollback signal. Backend: GET /api/tv/telemetry/open (204, CORS *).
  function telemetry(src) {
    try {
      var ua = (navigator.userAgent || '').toLowerCase();
      var plat = 'other';
      if (window.tizen || ua.indexOf('tizen') !== -1) plat = 'tizen';
      else if (window.webOS || window.webOSSystem || ua.indexOf('web0s') !== -1 || ua.indexOf('webos') !== -1) plat = 'webos';
      var did = '';
      try {
        did = localStorage.getItem('mr_did');
        if (!did) { did = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('mr_did', did); }
      } catch (e) {}
      new Image().src = 'https://api.themegaradio.com/api/tv/telemetry/open'
        + '?src='  + src
        + '&v='    + encodeURIComponent(REMOTE_VERSION || APP_VERSION || '')
        + '&plat=' + plat
        + '&app='  + encodeURIComponent(APP_VERSION || '')
        + '&did='  + encodeURIComponent(did || '');
    } catch (_) {}
  }

  function loadLocal() {
    // Injection started != application loaded. Still fall back on missing CDN
    // assets, timeout, or offline relaunch with cached HTML.
    if (fallingBack) return;
    fallingBack = true;
    done = true;
    if (bootTimer) clearTimeout(bootTimer);
    try { delete window.__MR_ASSET_BASE__; } catch (e) {}
    // Discard only a failed OTA cache, never account/favorite storage.
    try { localStorage.removeItem('mr_cdn_html'); localStorage.removeItem('mr_cdn_ver'); } catch (e) {}
    telemetry('local');
    try { window.location.replace(LOCAL); } catch (e) { window.location.href = LOCAL; }
  }

  function toAbs(u) {
    if (!u) return u;
    if (/^https?:\/\//i.test(u)) return u;     // already absolute
    if (u.indexOf('//') === 0) return u;       // protocol-relative
    if (u.indexOf('data:') === 0) return u;    // inline data URI
    return CDN_BASE + u.replace(/^\.?\//, ''); // "./js/x" | "/js/x" -> CDN + "js/x"
  }

  // Misconfigured base → never hang; run the local copy.
  if (!CDN_BASE || CDN_BASE.indexOf('__CDN') === 0 || CDN_BASE.indexOf('http') !== 0) {
    loadLocal(); return;
  }

  // Tell the app to resolve image/font asset paths against the CDN.
  try { window.__MR_ASSET_BASE__ = CDN_BASE; } catch (e) {}

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function injectFromHtml(html) {
    if (done) return;
    var doc;
    try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { doc = null; }
    if (!doc || !doc.head || !doc.body) { loadLocal(); return; }
    var legacyPolyfill = doc.getElementById('vite-legacy-polyfill');
    var legacyEntry = doc.getElementById('vite-legacy-entry');
    if (!legacyPolyfill || !legacyEntry || !legacyEntry.getAttribute('data-src')) {
      // Cached older module-only HTML cannot boot Chromium38/53. Use new package.
      loadLocal(); return;
    }
    done = true;
    try { window.__MR_BOOT_SRC__ = 'cdn'; } catch (e) {}   // Settings shows "· C"
    window.__MR_APP_READY__ = false;
    window.__MR_BOOT_FALLBACK__ = loadLocal;
    function onReady() {
      if (fallingBack) return;
      if (bootTimer) clearTimeout(bootTimer);
      document.removeEventListener('megaradio-ready', onReady);
      telemetry('remote');
    }
    document.addEventListener('megaradio-ready', onReady);
    bootTimer = setTimeout(loadLocal, TIMEOUT);

    // 1) <link> (fonts / preconnect / stylesheets) + inline <style> from head.
    var headNodes = doc.head.querySelectorAll('link, style');
    for (var i = 0; i < headNodes.length; i++) {
      var n = headNodes[i];
      if (n.tagName === 'LINK') {
        if ((n.getAttribute('rel') || '').toLowerCase() === 'modulepreload') continue;
        var l = document.createElement('link');
        for (var a = 0; a < n.attributes.length; a++) {
          var at = n.attributes[a];
          l.setAttribute(at.name, at.name === 'href' ? toAbs(at.value) : at.value);
        }
        document.head.appendChild(l);
        if ((l.rel || '').toLowerCase() === 'stylesheet') l.onerror = loadLocal;
      } else {
        var st = document.createElement('style');
        st.textContent = n.textContent;
        document.head.appendChild(st);
      }
    }

    // 2) All packaged TVs use the classic SystemJS path (also works on file://).
    // Preserve attributes/IDs; skip modern module probes and nomodule auto-loader.
    var scripts = doc.querySelectorAll('script');
    var queue = [];
    for (var j = 0; j < scripts.length; j++) {
      var sc = scripts[j];
      var type = (sc.getAttribute('type') || '').toLowerCase();
      if (type === 'module' || sc.hasAttribute('nomodule') || sc === legacyEntry || sc === legacyPolyfill) continue;
      if (type && type !== 'text/javascript' && type !== 'application/javascript') continue;
      queue.push(sc);
    }
    queue.push(legacyPolyfill);

    function runNext(k) {
      if (fallingBack) return;
      if (k >= queue.length) {
        try {
          if (!window.System || !window.System.import) { loadLocal(); return; }
          window.System.import(toAbs(legacyEntry.getAttribute('data-src'))).catch(loadLocal);
        } catch (e) { loadLocal(); }
        // Loading a script is not proof React mounted. Only megaradio-ready
        // clears the watchdog and marks a successful remote boot.
        return;
      }
      var sc = queue[k];
      var src = sc.getAttribute('src');
      var el = document.createElement('script');
      el.async = false;
      for (var a = 0; a < sc.attributes.length; a++) {
        var attr = sc.attributes[a];
        if (attr.name === 'src' || attr.name === 'nomodule' || attr.name === 'defer' || attr.name === 'async') continue;
        el.setAttribute(attr.name, attr.name === 'data-src' ? toAbs(attr.value) : attr.value);
      }
      if (src) {
        el.src = toAbs(src);
        if (sc.getAttribute('crossorigin') !== null) el.crossOrigin = 'anonymous';
        el.onload = function () { runNext(k + 1); };
        el.onerror = loadLocal;
        document.body.appendChild(el);
      } else {
        el.text = sc.textContent || '';
        document.body.appendChild(el);
        runNext(k + 1);
      }
    }
    runNext(0);
  }

  // === CACHE-FIRST boot (non-blocking) ===
  // The running app's background updater (bundleUpdater.ts) stores the latest CDN
  // index.html in localStorage('mr_cdn_html'). Here we inject it INSTANTLY — no
  // network on the critical path, so the app never blocks on boot. If there is no
  // cache yet (fresh install) or it was cleared (killSwitch rollback), boot the
  // bundled LOCAL copy instantly. The app then refreshes the cache for NEXT launch.
  // (Old hashed assets are kept on the CDN by build-cdn.js, so a cached older
  //  index.html never 404s.)
  var cachedHtml = lsGet('mr_cdn_html');
  if (cachedHtml) {
    REMOTE_VERSION = lsGet('mr_cdn_ver') || '';
    injectFromHtml(cachedHtml);
  } else {
    loadLocal();
  }
})();
</script>
</body>
</html>
